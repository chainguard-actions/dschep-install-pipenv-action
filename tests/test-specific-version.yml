name: Test specific version of pipenv
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "2023.12.1"
      - name: Assert specific pipenv version is installed
        run: |
          echo "Checking pipenv is available..."
          if ! command -v pipenv >/dev/null 2>&1; then
            echo "FAIL: pipenv command not found"
            exit 1
          fi
          VERSION_OUTPUT="$(pipenv --version 2>&1)"
          echo "pipenv version: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "2023.12.1"; then
            echo "FAIL: expected version 2023.12.1 but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS: pipenv 2023.12.1 is installed"
